<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3"/>
      <stop offset="40%" stop-color="#C8A66A"/>
      <stop offset="100%" stop-color="#8F6C2E"/>
    </linearGradient>
    <radialGradient id="tealCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09676A"/>
      <stop offset="100%" stop-color="#042F32"/>
    </radialGradient>
  </defs>
  <!-- Outer serrated / scalloped seal -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#badgeGold)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="86" fill="url(#tealCenter)" stroke="url(#badgeGold)" stroke-width="1.2" stroke-dasharray="3,2"/>
  
  <!-- Ribbon laurels -->
  <path d="M42,100 C40,70 60,45 100,42 C140,45 160,70 158,100" fill="none" stroke="url(#badgeGold)" stroke-width="1.2" opacity="0.65"/>
  
  <!-- Text in seal -->
  <text x="100" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#F2DFB3" text-anchor="middle">GOVT RECOGNIZED</text>
  <text x="100" y="98" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="700" fill="url(#badgeGold)" text-anchor="middle" letter-spacing="2">ISO</text>
  <text x="100" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#FAF6ED" text-anchor="middle">CERTIFIED</text>
  <text x="100" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#D9B7B1" text-anchor="middle">ACADEMY</text>
  
  <!-- Star accents -->
  <polygon points="100,146 102,152 108,152 103,156 105,162 100,158 95,162 97,156 92,152 98,152" fill="url(#badgeGold)"/>
</svg>
