<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F42"/>
      <stop offset="50%" stop-color="#075D60"/>
      <stop offset="100%" stop-color="#521536"/>
    </linearGradient>
    <linearGradient id="cGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4BE"/>
      <stop offset="50%" stop-color="#C8A66A"/>
      <stop offset="100%" stop-color="#9E7A3E"/>
    </linearGradient>
    <linearGradient id="cWine1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76204F"/>
      <stop offset="100%" stop-color="#3B0C24"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#cBg1)"/>
  <!-- Decorative borders -->
  <rect x="25" y="25" width="750" height="550" rx="16" fill="none" stroke="url(#cGold1)" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="530" rx="12" fill="none" stroke="url(#cGold1)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Corner embellishments -->
  <circle cx="25" cy="25" r="8" fill="#C8A66A"/>
  <circle cx="775" cy="25" r="8" fill="#C8A66A"/>
  <circle cx="25" cy="575" r="8" fill="#C8A66A"/>
  <circle cx="775" cy="575" r="8" fill="#C8A66A"/>

  <!-- Top Badge -->
  <rect x="260" y="55" width="280" height="38" rx="19" fill="#042F32" stroke="url(#cGold1)" stroke-width="1.2"/>
  <text x="400" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#F5E4BE" text-anchor="middle">FOUNDATION TO PROFESSIONAL</text>

  <!-- Title -->
  <text x="400" y="150" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="700" fill="url(#cGold1)" text-anchor="middle" letter-spacing="1">15-DAY MASTERCLASS</text>
  <text x="400" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#FAF6ED" text-anchor="middle" letter-spacing="4">PROFESSIONAL MAKEUP COURSE</text>

  <!-- Price Pill -->
  <g transform="translate(300, 215)">
    <rect width="200" height="60" rx="30" fill="url(#cWine1)" stroke="url(#cGold1)" stroke-width="2"/>
    <text x="100" y="42" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="700" fill="#FAF6ED" text-anchor="middle">₹10,000</text>
  </g>

  <!-- Inclusions Columns -->
  <g transform="translate(90, 310)">
    <!-- Card 1 -->
    <rect width="180" height="110" rx="10" fill="#042F32" stroke="url(#cGold1)" stroke-width="1" opacity="0.9"/>
    <text x="90" y="45" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="700" fill="url(#cGold1)" text-anchor="middle">20</text>
    <text x="90" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FAF6ED" text-anchor="middle">HAIR STYLES</text>
    <text x="90" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#D9B7B1" text-anchor="middle">Advanced Techniques</text>
  </g>
  <g transform="translate(310, 310)">
    <!-- Card 2 -->
    <rect width="180" height="110" rx="10" fill="#042F32" stroke="url(#cGold1)" stroke-width="1" opacity="0.9"/>
    <text x="90" y="45" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="700" fill="url(#cGold1)" text-anchor="middle">5</text>
    <text x="90" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FAF6ED" text-anchor="middle">MAKEUP LOOKS</text>
    <text x="90" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#D9B7B1" text-anchor="middle">Bridal, HD &amp; Glam</text>
  </g>
  <g transform="translate(530, 310)">
    <!-- Card 3 -->
    <rect width="180" height="110" rx="10" fill="#042F32" stroke="url(#cGold1)" stroke-width="1" opacity="0.9"/>
    <text x="90" y="45" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="700" fill="url(#cGold1)" text-anchor="middle">8</text>
    <text x="90" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FAF6ED" text-anchor="middle">DRAPING STYLES</text>
    <text x="90" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#D9B7B1" text-anchor="middle">Box Folding &amp; Saree</text>
  </g>

  <!-- Bottom Bonuses -->
  <g transform="translate(80, 455)">
    <rect width="640" height="75" rx="12" fill="#094A4D" stroke="url(#cGold1)" stroke-width="1" opacity="0.85"/>
    <text x="320" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F5E4BE" text-anchor="middle">COMPLIMENTARY CAREER ACCELERATOR</text>
    <text x="320" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#FAF6ED" text-anchor="middle">Digital Marketing • Social Media Handling • Lifetime Artist ID • ISO Certified Certificate</text>
  </g>

  <text x="400" y="560" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#D9B7B1" text-anchor="middle">LIMITED TO 20 SEATS PER BATCH • SR NAGAR, HYDERABAD</text>
</svg>